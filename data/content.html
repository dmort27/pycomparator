<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shodhganga 2.0 Beta</title>
<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #eef2f7, #d9e4f5);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: #ffffff;
        padding: 50px 60px;
        border-radius: 14px;
        box-shadow: 0 12px 35px rgba(0,0,0,0.08);
        text-align: center;
        max-width: 550px;
    }

    .brand {
        font-size: 18px;
        font-weight: 600;
        color: #1f4e79;
        margin-bottom: 10px;
    }

    h1 {
        margin: 10px 0 15px;
        font-weight: 600;
        color: #2c3e50;
        font-size: 26px;
    }

    p {
        color: #5f6b7a;
        font-size: 16px;
        line-height: 1.6;
    }

    .icon {
        font-size: 46px;
        margin-bottom: 15px;
    }


    .contact {
        margin-top: 8px;
        font-size: 14px;
        color: #1f4e79;
        font-weight: 500;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="brand">Shodhganga 2.0 Beta</div>
        <div class="icon">📘</div>
        <h1>Full Text Thesis Unavailable</h1>
        <p>
             The full text thesis is currently unavailable in Shodhganga 2.0 Beta.

        </p>
    </div>
</body>
</html>
