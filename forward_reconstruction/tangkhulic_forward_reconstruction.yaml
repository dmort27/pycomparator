# Sound Laws for Proto-Tangkhulic Forward Reconstruction
#
# This file defines sound laws and a phylogenetic tree for applying them.
# Laws map proto-forms to reflexes in daughter languages.
# Leaf nodes use glottocodes that resolve to language IDs in the database.

name: tangkhulic

# Sound laws: [source, target, left_context, right_context]
# - Empty string "" means "no constraint" for contexts
# - Empty source "" means insertion; empty target "" means deletion
# - Use \Z for word-final position in right context
# Laws are sorted by source, then target
laws:
  # a-
  a-lowering: ["a", "ɐ", "", "[mnŋptk]"]
  a-to-e-final: ["a", "e", "", "\\Z"]
  a-to-i-final: ["a", "i", "", "\\Z"]
  a-to-u-final: ["a", "u", "", "\\Z"]
  a-to-o-closed: ["a", "o", "", "[ptkmnŋr]"]
  a-and-e-to-i-final: ["[ae]", "i", "", "\\Z"]
  a-to-we: ["a", "we", "", "\\Z"]

# aa-
  aang-to-i: ["aːŋ", "i", "", ""]

# aj-
  aj-to-ej: ["aj", "ej", "", "\\Z"]
  aj-to-ej-final: ["aj", "ej", "", "\\Z"]
  aj-to-i: ["aj", "i", "", ""]
  aj-to-i-final: ["aj", "i", "", "\\Z"]
  aj-to-ie: ["aː?j", "ie", "", "\\Z"]
  aj-to-we-final: ["aj", "we", "", "\\Z"]

  # at
  at-to-e: ["at", "e", "", ""]

  # aw-
  aw-to-a-final: ["aw", "a", "", "\\Z"]
  aw-to-o-final: ["aw", "o", "", "\\Z"]
  aw-to-ow-final: ["aw", "ow", "", "\\Z"]
  aw-to-turned-m: ["aw", "ɯ", "", "\\Z"]

  # b-
  b-to-p: ["b", "p", "", ""]
  bw-to-v: ["bw", "v", "", ""]

  # c-
  c-to-ts: ["c", "t͡s", "", ""]

  # dz-
  dz-to-d: ["d͡z", "d", "", ""]
  dz-to-r: ["d͡z", "r", "", ""]

  # e
  e-to-i-final: ["e", "i", "", "\\Z"]
  e-to-turned-a-cor: ["e", "ɐ", "", "[tn]"]
  e-and-u-to-ej-before-t: ["[eu]", "ej", "", "t"]

  # ej-
  ej-to-a-final: ["ej", "a", "", "\\Z"]
  ej-to-aj-final: ["ej", "aj", "", "\\Z"]
  ej-to-e-final: ["ej", "e", "", "\\Z"]
  ej-to-i-final: ["ej", "i", "", "\\Z"]
  ej-to-u-final: ["ej", "u", "", "\\Z"]

  # esh-
  esh-to-s: ["ʃ", "s", "", ""]

  # ew
  ew-to-ow: ["ew", "ow", "", "\\Z"]
  ew-to-u: ["ew", "u", "", "\\Z"]

  nonhigh-vowels-to-e-before-cor: ["(e|o|ɐ|aː)", "e", "", "tn"]
  nonhigh-vowels-to-o-before-lab: ["(e|o|ɐ|aː)", "o", "", "[pm]"]

  i-to-a-before-k: ["i", "a", "k", "\\Z"]
  i-to-turned-a-non-lab: ["i", "ɐ", "", "[tknŋ]"]
  i-to-turned-m-final: ["i", "ɯ", "", "\\Z"]

  # -l
  l-to-j: ["l", "j", "", "\\Z"]
  l-to-n-final: ["l", "n", "", "\\Z"]

  ok-to-u: ["o", "u", "", "\\Z"]
  o-engma-to-nasal-a: ["[oɐ]ːŋ", "a̰", "", ""]
  o-to-turned-a-tkn: ["o", "ɐ", "", "[tkn]"]
  o-to-u-final: ["o", "u", "", "\\Z"]
  o-to-u-before-velar: ["o", "u", "", "[kŋ]"]
  o-to-turned-m-final: ["o", "ɯ", "", "\\Z"]
  o-u-to-y-after-cor: ["[ou]", "y", "[tnlr]"]
  o-to-turned-a-before-son: ["o", "ɐ", "", "[mnŋl]"]

  # oj
  oj-to-u: ["oj", "u", "", "\\Z"]
  oj-ow-to-uj: ["o[wj]", "uj", "", ""]

  # ow-
  ow-to-ao-final: ["ow", "ao", "", "\\Z"]
  ow-to-aw-final: ["ow", "aw", "", "\\Z"]
  ow-to-e-final: ["ow", "e", "", "\\Z"]
  ow-to-uj: ["ow", "uj", "", "\\Z"]
  ow-to-uə: ["ow", "uə", "", ""]

  oon-to-turned-a-engma: ["oːn", "ɐŋ", "", ""]

  n-to-zero-after-e: ["n", "ɐ", "", "e"]

  p-to-glottal-stop-after-low-final: ["p", "ʔ", "[ɐa]", "\\Z"]
  p-to-glottal-stop-after-low-final2: ["p", "ʔ", "aː", "\\Z"]
  cor-to-glottal-stop-final: ["[tk]", "ʔ", "", "\\Z"]
  # -r
  r-to-engma-final: ["r", "ŋ", "", "\\Z"]

  # short-a-
  short-a-to-a: ["ă", "a", "", ""]

  # stop-
  stop-to-glottal-final: ["[ptk]", "ʔ", "", "\\Z"]

  # t
  tk-to-glottal-stop: ["[tk]", "ʔ", "", "\\Z"]
  # tc-go-c: ["", "", "", ""]
  thi-to-tch: ["tʰi", "t͡ɕʰ", "", ""]

  u-to-y-final: ["u", "y", "", "\\Z"]
  # w-
  w-between-k-and-ow: ["k", "w", "ow", "\\Z"]
  w-to-h: ["w̥", "h", "", ""]

  k-after-high: ["", "k", "[ui]", "\\Z"]

    # uj
  Vj-to-i: ["[eou]j", "i", "", "\\Z"]
  uj-to-u: ["uj", "u", "", "\\Z"]
  uj-to-y-final: ["uj", "y", "", "\\Z"]

  # iou
  iou-to-turned-a: ["[iou]", "ɐ", "", "\\Z"]

  # low vowels
  low-to-ej-before-cor: ["(ɐ|a|aː)", "ej", "", "t"]

  # length
  short-vowels-to-turned-m-schwa: ["[aeiou]", "ɯə", "", ""]
  shortening: ["ː", "", "", ""]

  # Nasalization
  vowel-nasalization: ["", "̃", "[aeiouɯ]", "[mnŋ]"]
  spread-nasalization: ["", "̃", "[aeiouɯ]", "[aeiouɯ]̃"]

  # Codas
  del-codas: ["[ptkmnŋlr]", "", "", "\\Z"]
  del-w-after-lj: ["[lj]", "", "w", ""]

  # Buccalization
  kh-to-kx-before-u-turned-m: ["kʰ", "k͡x", "", "[uɯ]"]
  h-to-s-before-turned-m: ["[hʰ]", "s", "p", "ɯ"]
  h-to-f-before-turned-m: ["ʰ", "f", "k", "ɯ"]
  h-to-x-before-u-o: ["[hʰ]", 'x', "", "[uo]\\Z"]
  h-to-curly-c-before-i: ["[hʰ]", "ɕ", "", "i"]

  # Fricative Vowels
  turned-m-to-z-after-s: ["ɯ", "z̩", "s", ""]

# Phylogenetic tree: maps parent nodes to lists of children with their laws
# Leaf nodes use glottocodes (e.g., phad1238) that resolve to database langids

tree:
  ROOT:
    - child: nuc-tangkhulic
      laws:
      - shortening
    - child: east2902 # Tusom
      laws:
        - i-to-turned-m-final
        - a-and-e-to-i-final
        - o-to-u-final
        - uj-to-y-final
        - aj-to-ie-final
        - aw-to-turned-m
        - ej-to-a-final
        - ew-to-u-schwa
        - nonhigh-vowels-to-e-before-cor
        - nonhigh-vowels-to-o-before-lab
        - o-engma-to-nasal-a
        - turned-a-engma-to-nasal-a
        - ok-to-u
        - short-vowels-to-turned-m-schwa
        - vowel-nasalization
        - spread-nasalization
        - kh-to-kx-before-u-turned-m
        - h-to-s-before-turned-m
        - h-to-f-before-turned-m
        - h-to-x-before-u-o
        - del-codas
        - o-u-to-y-after-cor
        - thi-to-tch
  nuc-tangkhulic:
    - child: north-tangkhulic
      laws:
        - uj-to-u
    - child: kach1286
      laws:
        - l-to-j
        - Vj-to-i
        - a-to-u
        - e-to-i
        - iou-to-turned-a
        - aj-to-we
        - aw-to-o
        - ow-to-e
        - a-to-o-closed
        - i-to-turned-a-non-lab
        - e-to-turned-a-cor
        - o-to-turned-a-tkn
  north-tangkhulic:
    - child: ukhr1238 # Ukhrul
      laws:
        - e-to-i-final
        - oj-ow-to-uj
    - child: chal1279.1 # Huishu
      laws:
        - aang-to-i
        - oon-to-turned-a-engma
        - a-to-we
        - i-to-turned-a-before-son
        - o-to-turned-a-before-son
        - del-w-after-lj
        - n-to-zero-after-e
        - dz-to-r
        - p-to-glottal-stop-after-low-final
        - p-to-glottal-stop-after-low-final2
        - tk-to-glottal-stop
        - k-after-high
        - o-to-u-final
        - o-to-u-before-velar
        - ej-to-u-final
        - aj-to-ej-final
        - aw-to-ow-final
        - ew-to-ow
        - oj-to-u
        - at-to-e
        - low-to-ej-before-cor
        - e-and-u-to-ej-before-t
        - l-to-n-final
        - r-to-engma-final
        - c-to-ts
